# invoke.yaml

# source data folders
source_data_dir: source_data

# output data folders
output_data_dir: output_data

# tool configurations: one YAML per tool (see analysis/tool_configs.py)
tools_dir: tools

# HTML report: mask volumes outside this range (mL) are highlighted. A rough
# adult brain range — adjust for children or atypical populations.
report:
  plausible_volume_ml: [1100, 1600]

# provenance records
#
# Written by `fetch` and `run` (see airoh.provenance). Both are git-tracked:
# they are small, and they are the only record of what produced a result when
# datalad is not in play. PROVENANCE.json is *expected* to change on every run
# — that churn is the record doing its job, not a bug to fix.
manifest_file: source_data/MANIFEST.json
provenance_file: output_data/PROVENANCE.json
# Files above this size record their metadata but no checksum, so one large
# asset cannot make every fetch crawl.
provenance_hash_max_bytes: 104857600

# `invoke verify` settings — all optional; delete this block to accept the
# defaults. See CLAUDE.md, "Verification".
verify:
  # Check names to skip entirely, e.g. [lint, tracked_size].
  skip_checks: []
  # Glob patterns exempt from the path and tracked-file checks.
  ignore_paths: []
  # Largest file git may track before the check fails (default 10 MB).
  max_tracked_bytes: 10485760

# file sources
#
# Each asset defines `output_file` plus `url` and/or `source`:
#   - `url`    : download the file over HTTP into `output_file`
#   - `source` : path to already-present data to symlink into `output_file`
#                instead of downloading (a per-asset alternative to the
#                `invoke fetch-{name} --source ...` flag)
files:
  # The BIDS dataset to benchmark. Never downloaded: link an existing one with
  # `invoke fetch --bids-source /path/to/bids` (or set `source:` here).
  bids:
    output_file: source_data/bids
  # The container images (Docker `.tar` archives and/or `.sif` files, nothing
  # else). Never downloaded either: `invoke fetch --containers-source /path`.
  containers:
    output_file: source_data/containers
  # The OASIS brain template used by antsBrainExtraction.sh, from the ANTs
  # templates on figshare (doi:10.6084/m9.figshare.915436). The one download
  # in this project: it is tool configuration, not data, and lives next to
  # tools/ants.yaml. `invoke fetch-ants-template` unzips what ANTs needs into
  # tools/ants/template/.
  ants_template:
    url: https://ndownloader.figshare.com/files/3133832
    output_file: tools/ants/Oasis.zip

# datalad datasets (optional)
#
# For a real datalad dataset (as opposed to a plain file/folder under
# `files:`), use `airoh.datalad` instead of `airoh.acquisition.fetch_data` —
# see CLAUDE.md, "Datalad datasets, and plain assets". Each entry supports
# `output_dir` (where the dataset checkout lives), `url` (to `datalad clone`),
# and `source` (an existing checkout to symlink instead). A plain
# `{name: output_dir}` string is also accepted.
#
# datasets:
#   cneuromod:
#     output_dir: source_data/cneuromod.all
#     url: https://github.com/courtois-neuromod/cneuromod.all.git
#     # source: /data/cneuromod.all   # symlink an existing checkout instead
