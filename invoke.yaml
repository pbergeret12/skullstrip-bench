# invoke.yaml

# Defaults for the path flags of `run`, `run-check` and `run-smoke`. Left
# null, --bids and --containers must be given on the command line. Set them to
# avoid retyping paths on one machine (keep such edits out of commits).
# Nothing is ever downloaded: these folders are read where they are.
inputs:
  bids: null          # the BIDS dataset
  containers: null    # container images only: <name>.tar and/or <name>.sif

# What a supported tool needs besides its image (atlases, templates, configs),
# one subfolder per tool, shipped with this project and with its container:
# users bring only their images and their dataset.
requirements_dir: container_requirements

# source data folder: unused by this project (inputs are read in place, see
# `inputs:`), kept because airoh's `verify` checks it against its CONTENT.md
source_data_dir: source_data

# default output folder (--output)
output_data_dir: output_data

# tool configurations: one YAML per tool (see analysis/tool_configs.py)
tools_dir: tools

# HTML report: mask volumes outside this range (mL) are highlighted. A rough
# adult brain range — adjust for children or atypical populations.
report:
  plausible_volume_ml: [1100, 1600]

# provenance records
#
# Written into the output's hidden .skullstrip-bench/ folder: MANIFEST.json by
# `run-check` (what each input path resolved to, with its git commit when it
# is a repository) and PROVENANCE.json by `run` (what produced the outputs).
# These are the defaults for --output output_data; both are git-tracked there.
manifest_file: output_data/.skullstrip-bench/MANIFEST.json
provenance_file: output_data/.skullstrip-bench/PROVENANCE.json
# Files above this size record their metadata but no checksum.
provenance_hash_max_bytes: 104857600

# `invoke verify` settings — all optional; delete this block to accept the
# defaults. See CLAUDE.md, "Verification".
verify:
  # Check names to skip entirely, e.g. [lint, tracked_size].
  skip_checks: []
  # Glob patterns exempt from the path and tracked-file checks. The docs name
  # things that look like paths but are not in this repository:
  ignore_paths:
    - "<output>/*"          # placeholders for the user's --output folder
    - "*:*"                 # Docker image references (name:tag)
    - "ants/*"              # tool requirement files, named relative to their folder
    - "MICCAI2012-Multi-Atlas-Challenge-Data"   # folder inside ANTs' Oasis.zip
    - "jobs.txt"            # written only by --scheduler slurm, under <output>/slurm/
    - "slurm"
    - "<workdir>"           # placeholders for the user's working directory
    - "<output>"            # ... and output folder
    - "results"             # the output folder the README's examples use
    - "results/*"
    - "logs"                # written in the user's working directory
    - "logs/*"
    - ".skullstrip-bench/*"
    - "dataset_description.json"   # lives in the user's BIDS dataset
    - "ants"                # a requirements subfolder, named on its own
    # Deliberately tracked despite size and type: the tools' bundled
    # requirements (ANTs' OASIS template, 32 MB, CC BY 4.0, see its SOURCE.md),
    # which users must not have to bring themselves.
    - "container_requirements/*"
  # Largest file git may track before the check fails (default 10 MB).
  max_tracked_bytes: 10485760
