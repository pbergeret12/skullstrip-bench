# SynthSeg: whole-brain segmentation (not a mask). labels_to_mask keeps every
# labelled voxel (CSF included) and resamples it onto the T1w grid, since
# SynthSeg works at 1 mm.
name: synthseg
image: cookpa/synthseg:conda-0.2
container: synthseg_conda-0.2
command: python /opt/SynthSeg/scripts/commands/SynthSeg_predict.py --i {input} --o {output_prefix}_seg.nii.gz --cpu --threads {threads}
mask_output: "{output_prefix}_seg.nii.gz"
postprocess: labels_to_mask
# A stuck run is stopped and recorded as `timeout`.
timeout_min: 120
# Cluster resources for one run: TensorFlow needs well over 8 GB.
cpus: 8
mem_gb: 16
minutes: 10
