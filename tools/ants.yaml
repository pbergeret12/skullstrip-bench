# ANTs antsBrainExtraction.sh with the OASIS template (fetched by
# `invoke fetch-ants-template` into tools/ants/template/, mounted as {tool_dir}).
# Slow: registration-based, several minutes per T1w even natively.
name: ants
image: antsx/ants:latest
container: ants_latest
command: >-
  antsBrainExtraction.sh -d 3 -a {input}
  -e {tool_dir}/template/T_template0.nii.gz
  -m {tool_dir}/template/T_template0_BrainCerebellumProbabilityMask.nii.gz
  -f {tool_dir}/template/T_template0_BrainCerebellumRegistrationMask.nii.gz
  -o {output_prefix}_
mask_output: "{output_prefix}_BrainExtractionMask.nii.gz"
# Under amd64 emulation on a Mac; a stuck run is stopped and recorded as `timeout`.
timeout_min: 240
